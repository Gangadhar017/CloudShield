services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudshield
      POSTGRES_PASSWORD: shieldpass123
      POSTGRES_DB: cloudshield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudshield -d cloudshield"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cloudshield-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - test-app

  test-app:
    build:
      context: ./test-app
      dockerfile: Dockerfile
    container_name: cloudshield-test-app
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - APP_NAME=CloudShield-Monitored-Test-App
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudshield-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cloudshield:shieldpass123@postgres:5432/cloudshield
      - PROMETHEUS_URL=http://prometheus:9090
      - TEST_APP_URL=http://test-app:8001
      - SECRET_KEY=cloudshield-super-secret-jwt-key-replace-in-production-2026
    depends_on:
      postgres:
        condition: service_healthy
      test-app:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudshield-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  prometheus_data:
